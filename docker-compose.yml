# YesWeSync — Docker Compose pour Coolify
#
# IMPORTANT : Ce compose NE décompose PAS Airbyte en services séparés.
# Airbyte 2.2.0 utilise abctl → kind → Kubernetes.
# Ce compose gère uniquement :
#   1. Le container de gestion abctl (qui installe Airbyte via kind)
#   2. Le PostgreSQL de staging (destination des syncs → YesWeReport)
#
# Airbyte lui-même tourne dans un cluster kind créé par abctl sur l'hôte Docker.

services:

  # ── Gestionnaire abctl — installe et supervise Airbyte 2.2.0 via kind ────────
  airbyte-manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: yeswesync-manager:0.30.4
    restart: unless-stopped
    privileged: true                      # Requis : kind nécessite cgroups
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # Socket Docker hôte
      - airbyte-abctl-home:/root/.airbyte           # Données abctl persistantes
    environment:
      AIRBYTE_URL: ${AIRBYTE_URL}
      AIRBYTE_PORT: ${AIRBYTE_PORT:-8085}
      AIRBYTE_INITIAL_USER_PASSWORD: ${AIRBYTE_INITIAL_USER_PASSWORD}
      AIRBYTE_INSTALLATION_ID: ${AIRBYTE_INSTALLATION_ID:-}
      AIRBYTE_JOB_CPU_LIMIT: ${AIRBYTE_JOB_CPU_LIMIT:-3}
      AIRBYTE_JOB_MEMORY_LIMIT: ${AIRBYTE_JOB_MEMORY_LIMIT:-4Gi}
      ABCTL_EXTRA_FLAGS: ${ABCTL_EXTRA_FLAGS:-}
    # Ne pas exposer de port ici — Airbyte est exposé par kind directement
    # sur l'hôte (port AIRBYTE_PORT). Coolify proxy → localhost:AIRBYTE_PORT.
    network_mode: "host"                  # Nécessaire pour que abctl/kind
                                          # ait accès au réseau de l'hôte

  # ── Staging PostgreSQL — destination des syncs → YesWeReport ─────────────────
  # Base séparée de la metadata DB Airbyte (gérée par abctl/kind en interne)
  staging-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_DB:-yeswesync_staging}
      POSTGRES_USER: ${STAGING_USER}
      POSTGRES_PASSWORD: ${STAGING_PASSWORD}
    volumes:
      - staging-db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${STAGING_PORT:-5433}:5432"   # Accès local uniquement
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STAGING_USER:-staging} -d ${STAGING_DB:-yeswesync_staging}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  # Données abctl : kubeconfig kind, données Helm, PVs Kubernetes
  # CRITIQUE — ne jamais supprimer ce volume
  airbyte-abctl-home:
    name: yeswesync-abctl-home

  # Données staging PostgreSQL → YesWeReport
  # CRITIQUE — contient les données métier
  staging-db-data:
    name: yeswesync-staging-db-data
